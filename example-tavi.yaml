# AlwaysBlock Configuration
# Block distracting websites with intentional delays

default_profile: unblock

# OPT-IN: quit native apps while their sites are blocked (off by default).
# Slack looks like it sends messages even when blocked; quitting it makes
# "blocked" unmistakable. `app` is the exact process name (`pgrep -x Slack`).
# kill_apps:
#   - app: Slack
#     when_blocked: [slack]

# Globally excluded domains (always allowed, even if parent domain is blocked)
excluded_domains:
  - accounts.google.com   # Allow Google accounts (for GSuite login)
  - myaccount.google.com  # Allow Google account management
  - accounts.youtube.com  # Allow YouTube accounts (for GSuite login)

domains:
  # Individual domains
  netflix.com:
    tags: [ultra_distracting, entertainment]

  instagram.com:
    tags: [social, distracting]

  reddit.com:
    tags: [social, distracting]

  youtube.com:
    tags: [entertainment, distracting]

  eventbrite.com:
    tags: [events]

  nytimes.com:
    tags: [news]

  cnn.com:
    tags: [news]

  timesofisrael.com:
    tags: [news]

  jpost.com:
    tags: [news]

  mrmoneymustache.com:
    tags: [finance]

  washingtonpost.com:
    tags: [news]

  foxnews.com:
    tags: [news]

  linkedin.com:
    tags: [social, professional]

  simplifimoney.com:
    tags: [finance]

  nextdoor.com:
    tags: [social]

  news.ycombinator.com:
    tags: [tech, news]

  # Domain groups
  twitter:
    domains:
      - twitter.com
      - x.com
      - api.x.com
      - t.co
      - twimg.com
      - twitpic.com
      - api.twitter.com
      - mobile.twitter.com
      - publish.twitter.com
      - ads.twitter.com
      - analytics.twitter.com
      - cards.twitter.com
      - cdn.twitter.com
      - developer.twitter.com
      - help.twitter.com
      - pbs.twimg.com
      - abs.twimg.com
      - video.twimg.com
      - vault.twimg.com
      - upload.twitter.com
      - stream.twitter.com
      - tweetdeck.twitter.com
      - ton.twitter.com
      - si0.twimg.com
      - si.twimg.com
      - o.twimg.com
      - ma.twimg.com
      - syndication.twitter.com
      - support.twitter.com
      - blog.twitter.com
      - business.twitter.com
      - careers.twitter.com
      - about.twitter.com
      - legal.twitter.com
      - status.twitter.com
      - partners.twitter.com
      - ads-api.twitter.com
      - dev.twitter.com
    tags: [social, distracting]

  facebook:
    domains:
      - facebook.com
      - messenger.com
      - m.me
      - fbcdn.net
      - business.facebook.com
      - adsmanager.facebook.com
    tags: [social, distracting]

  slack:
    domains:
      - slack.com
      - slack-edge.com
      - cdn.slack.com
      - api.slack.com
    tags: [communication, work]

  gmail:
    domains:
      - gmail.com
      - www.gmail.com
      - mail.google.com
      - www.mail.google.com
      - googlemail.com
      - www.googlemail.com
    tags: [communication, email]

profiles:
  # Standard unblock
  unblock:
    description: "Standard unblock with wait time"
    wait:
      base: 5              # 5 minute wait
      concurrent_penalty: 5 # +5 min per concurrent unblock
    duration: 30           # Stay unblocked for 30 minutes

    # Tag-based wait time overrides
    tag_rules:
      - tags: [ultra_distracting]
        wait_override: 30  # 30 min wait for Netflix, etc.
      - tags: [work, communication]
        wait_override: 1   # 1 min wait for Slack

  # Quick check - all domains
  quick:
    description: "Quick 1-minute check"
    wait: 0.5              # 30 seconds
    duration: 1
    target_type: all       # No targets; runs independently by default

  # Emergency bypass - all domains
  bypass:
    description: "Emergency 5-minute unblock (once per hour)"
    wait: 0
    duration: 5
    cooldown: 60
    target_type: all       # No targets; runs independently by default

  # Peek at a single site
  peek:
    description: "Quick peek at one site"
    wait: 0
    duration: 1
    target_type: single    # Must be called with exactly one target

  # Work mode
  work:
    description: "Work mode - Slack only"
    wait: 0
    duration: 120          # 2 hours
    only: [slack]

  # News reading
  news:
    description: "News reading session"
    wait: 5
    duration: 20
    tags: [news]
