<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AlwaysBlock</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 1rem 1.1rem 1.2rem; background: #11151c; color: #e6e9ef; }
    h1 { font-size: 1.05rem; margin: 0 0 .2rem; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: .88rem; padding: .35rem 0; border-bottom: 1px solid #222b36; }
    .row:last-of-type { border-bottom: none; }
    .muted { color: #97a3b6; }
    .dot { font-size: .8rem; }
    button { font: inherit; width: 100%; padding: .55rem; margin-top: .5rem; border-radius: 9px; border: 1px solid #2a3340; background: #1b212b; color: #e6e9ef; cursor: pointer; }
    button.primary { background: #3b82f6; border: none; color: #fff; font-weight: 600; }
    #note { font-size: .78rem; color: #97a3b6; margin-top: .8rem; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>AlwaysBlock <span class="muted" style="font-weight:400">· Chrome</span></h1>
  <div class="row"><span>Bridge</span><span id="bridge" class="dot">checking…</span></div>
  <div class="row"><span>Blocking</span><span id="blocking" class="dot">—</span></div>
  <div class="row"><span>Blocked sites</span><span id="count" class="muted">—</span></div>

  <button class="primary" id="blockAll">Block everything now</button>
  <button id="disable">Disable until midnight</button>
  <button id="resume">Resume blocking</button>

  <p id="note">This is the Chrome backend. It covers Chrome tabs only — Incognito
  and other browsers are covered by the system proxy backend if you have it on.</p>
  <script src="options.js"></script>
</body>
</html>
