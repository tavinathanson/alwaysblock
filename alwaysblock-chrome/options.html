<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AlwaysBlock</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, sans-serif; width: 340px; margin: 0; padding: 1rem 1.1rem 1.1rem; background: #11151c; color: #e6e9ef; }
    h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: .88rem; padding: .35rem 0; border-bottom: 1px solid #222b36; }
    .muted { color: #97a3b6; }
    .dot { font-size: .8rem; }
    h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: #97a3b6; margin: .9rem 0 .25rem; }
    .list .item { display: flex; justify-content: space-between; padding: .22rem 0; font-size: .85rem; }
    .list .name { color: #ff8f6b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list .pending .name { color: #e6c07b; }
    .list .empty { color: #97a3b6; padding: .22rem 0; font-size: .85rem; }
    code { background: #0c1117; border: 1px solid #2a3340; border-radius: 6px; padding: .08rem .35rem; font-size: .82rem; }
    #hint { font-size: .78rem; color: #97a3b6; margin-top: .9rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>AlwaysBlock <span class="muted" style="font-weight:400">· Chrome</span></h1>
  <div class="row"><span>Bridge</span><span id="bridge" class="dot">checking…</span></div>
  <div class="row"><span>Blocking</span><span id="blocking" class="dot">—</span></div>

  <h2>Status</h2>
  <div id="sessions" class="list"><div class="empty">…</div></div>

  <p id="hint">
    Request access from a terminal, e.g. <code>alwaysblock unblock reddit</code>.
    Other browsers / Incognito are covered by the system-proxy backend if it's on.
  </p>
  <script src="options.js"></script>
</body>
</html>
